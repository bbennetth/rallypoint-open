# events-api as a Cloudflare Worker (#313, Phase 4). `wrangler deploy --env qa`
# -> events.rallypt.dev, `--env prod` -> events.rallypt.app. Entry is
# src/worker.ts (`{ fetch, scheduled }`); the Node server.ts was retired.
#
# Account + auth come from CI/the deployer (CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID); D1 databases and R2 buckets are auto-provisioned by
# wrangler >=4.45 / the bootstrap step. Real secrets via
# `wrangler secret bulk --env <env>` (cf-deploy.yml push-secrets step):
#   EVENTS_SESSION_KEY_V1
#   REALTIME_TOKEN_HMAC_KEY
#   OPEN_METEO_COMMERCIAL_API_KEY  (only if using commercial Open-Meteo tier)
#   ADMIN_USER_IDS  (system-event admin allowlist — MUST be pushed with the
#                    same value as admin-api's ADMIN_USER_IDS secret; drift
#                    means an admin can manage a system event via admin-web
#                    but 404 on it in events-web)
# Map image + ticket object storage is a native R2 binding (OBJECT_STORE),
# not keys (#409). The old EVENTS_OBJECT_STORE_* vars are retired.

name = "rallypoint-events"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the events-web SPA from the assets dir; run the Worker first for
# the API and the public OG-templated event page, so /api/* and /e/* hit
# the Worker (the latter server-injects og:* tags into the SPA shell for
# crawler unfurls — see routes/public-html.ts) while everything else serves
# first-party from the same origin (the __Host- cookie config). The deploy
# build populates ./public from `npm run build -w @rallypoint/events-web`; a
# committed placeholder keeps `wrangler dev` working pre-build.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/e/*"]

# RealtimeHub Durable Object. The class is exported from src/worker.ts
# (re-exported from @rallypoint/realtime). Migrations are script-global
# (shared across environments); the binding is redeclared per environment
# below (wrangler does not inherit bindings into named envs).
[[migrations]]
tag = "v1"
new_classes = ["RealtimeHub"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "RealtimeHub"

# RateLimitCounter Durable Object (#881) — one SQLite-backed DO per token
# bucket, replacing the per-request D1 write in the rate limiter. DO
# migrations are append-only: this is a NEW tag, never edit v1.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimitCounter"]

[[durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitCounter"

# Cron Trigger — runs the events pruner + weather refresher once per hour.
# The pruner grace period is 30 days so hourly is plenty; the weather
# refresher staleness gate is 3 hours (EVENTS_WEATHER_FRESHNESS_MS default)
# so an hourly tick stays well within it. The */5 tick is the D1
# keep-warm ping only (worker.ts dispatches on event.cron).
[triggers]
crons = ["0 * * * *", "*/5 * * * *"]

# Local-dev / top-level config (used by `wrangler dev`). parseEnv fills
# dev-safe defaults for the secrets.
[vars]
NODE_ENV = "development"
EVENTS_UI_ORIGIN = "http://localhost:5174"
RPID_API_URL = "http://localhost:8080"
LISTS_API_URL = "http://localhost:8082"
MONEY_API_URL = "http://localhost:8083"
OPEN_METEO_FORECAST_URL = "https://api.open-meteo.com/v1/forecast"
OPEN_METEO_AIR_QUALITY_URL = "https://air-quality-api.open-meteo.com/v1/air-quality"

[[d1_databases]]
binding = "DB"
database_name = "rp-events-local"
# Ignored by `wrangler dev --local` (local SQLite store); a real id is only
# needed for the per-env deploy blocks below.
database_id = "local-dev-unused"
migrations_dir = "../../packages/events-db/migrations"

# Map image + ticket object storage (#409). `wrangler dev` backs this with a
# local (Miniflare) R2 bucket; the per-env blocks below bind the real buckets.
[[r2_buckets]]
binding = "OBJECT_STORE"
bucket_name = "rallypoint-events-dev"

# Workers AI binding for the admin lineup-ingestion extraction
# (services/rpc-core/lineup-ingest-core.ts). Local `wrangler dev` calls
# Workers AI directly (no AI_GATEWAY_ID var); qa/prod route through the
# `rallypoint-ai` AI Gateway (var set per env below).
[ai]
binding = "AI"

# Top-level service bindings — required for cross-process RPC under wrangler's
# local dev registry (PR 2 of feat/rpc-bindings). When a sibling Worker is up
# under the same dev-registry, calls dispatch RPC method-to-method. Without a
# top-level binding, local dev had `env.RPID` undefined and the consumer fell
# back to fetch(URL + Bearer). After PR 2 the consumer expects the binding.
[[services]]
binding = "RPID"
service = "rallypoint-id"
entrypoint = "IdRPC"

[[services]]
binding = "LISTS"
service = "rallypoint-lists"
entrypoint = "ListsRPC"

[[services]]
binding = "MONEY"
service = "rallypoint-money"
entrypoint = "MoneyRPC"

[[services]]
binding = "AI_TRACES"
service = "rallypoint-ai"
entrypoint = "AiRPC"

# POSTHOG_KEY is the public phc_ project write key (same class of value
# the web bundles ship) — plaintext var, drives server-side $exception
# capture in the error handler. Omitted from dev [vars] → capture no-ops.
# ---- QA: events.rallypt.dev -----------------------------------------
[env.qa]
vars = { NODE_ENV = "production", TRUSTED_PROXY_HEADER = "cf-connecting-ip", AI_GATEWAY_ID = "rallypoint-ai", EVENTS_UI_ORIGIN = "https://events.rallypt.dev", RPID_API_URL = "https://id.rallypt.dev", LISTS_API_URL = "https://lists.rallypt.dev", MONEY_API_URL = "https://money.rallypt.dev", OPEN_METEO_FORECAST_URL = "https://api.open-meteo.com/v1/forecast", OPEN_METEO_AIR_QUALITY_URL = "https://air-quality-api.open-meteo.com/v1/air-quality", POSTHOG_KEY = "phc_pXfCBfcjuzNTkDuvouacPuiJjKxb5f9VM2FjUcBLA4bA", DEPLOY_ENV = "qa" }

[[env.qa.r2_buckets]]
binding = "OBJECT_STORE"
bucket_name = "rallypoint-events-qa"

[[env.qa.d1_databases]]
binding = "DB"
database_name = "rp-events-qa"
# database_id injected by cf-deploy.yml at deploy time — do NOT add manually
# (name-linking fails `d1 migrations apply --remote`; bootstrap: `wrangler d1 create rp-events-qa || true`).
migrations_dir = "../../packages/events-db/migrations"

[[env.qa.durable_objects.bindings]]
name = "HUB"
class_name = "RealtimeHub"

[[env.qa.durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitCounter"

# Service bindings: same-account cross-Worker RPC calls to
# IdRPC/ListsRPC/MoneyRPC via the typed `entrypoint` fields.
# Top-level [[services]] blocks (above) make wrangler's local dev
# registry connect cross-process during `npm run dev:stack`.
[[env.qa.services]]
binding = "RPID"
service = "rallypoint-id-qa"
entrypoint = "IdRPC"

[[env.qa.services]]
binding = "LISTS"
service = "rallypoint-lists-qa"
entrypoint = "ListsRPC"

[[env.qa.services]]
binding = "MONEY"
service = "rallypoint-money-qa"
entrypoint = "MoneyRPC"

[[env.qa.services]]
binding = "AI_TRACES"
service = "rallypoint-ai-qa"
entrypoint = "AiRPC"

[env.qa.ai]
binding = "AI"

[env.qa.triggers]
crons = ["0 * * * *", "*/5 * * * *"]

[[env.qa.routes]]
pattern = "events.rallypt.dev"
custom_domain = true

# ---- Prod: events.rallypt.app ---------------------------------------
[env.prod]
vars = { NODE_ENV = "production", TRUSTED_PROXY_HEADER = "cf-connecting-ip", AI_GATEWAY_ID = "rallypoint-ai", EVENTS_UI_ORIGIN = "https://events.rallypt.app", RPID_API_URL = "https://id.rallypt.app", LISTS_API_URL = "https://lists.rallypt.app", MONEY_API_URL = "https://money.rallypt.app", OPEN_METEO_FORECAST_URL = "https://api.open-meteo.com/v1/forecast", OPEN_METEO_AIR_QUALITY_URL = "https://air-quality-api.open-meteo.com/v1/air-quality", POSTHOG_KEY = "phc_pXfCBfcjuzNTkDuvouacPuiJjKxb5f9VM2FjUcBLA4bA", DEPLOY_ENV = "prod" }

[[env.prod.r2_buckets]]
binding = "OBJECT_STORE"
bucket_name = "rallypoint-events-prod"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "rp-events-prod"
# database_id injected by cf-deploy.yml at deploy time — do NOT add manually
# (name-linking fails `d1 migrations apply --remote`; bootstrap: `wrangler d1 create rp-events-prod || true`).
migrations_dir = "../../packages/events-db/migrations"

[[env.prod.durable_objects.bindings]]
name = "HUB"
class_name = "RealtimeHub"

[[env.prod.durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitCounter"

[[env.prod.services]]
binding = "RPID"
service = "rallypoint-id-prod"
entrypoint = "IdRPC"

[[env.prod.services]]
binding = "LISTS"
service = "rallypoint-lists-prod"
entrypoint = "ListsRPC"

[[env.prod.services]]
binding = "MONEY"
service = "rallypoint-money-prod"
entrypoint = "MoneyRPC"

[[env.prod.services]]
binding = "AI_TRACES"
service = "rallypoint-ai-prod"
entrypoint = "AiRPC"

[env.prod.ai]
binding = "AI"

[env.prod.triggers]
crons = ["0 * * * *", "*/5 * * * *"]

[[env.prod.routes]]
pattern = "events.rallypt.app"
custom_domain = true
