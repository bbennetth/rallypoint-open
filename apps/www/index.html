<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The marketing site is dark-only (Soft Ink design handoff) — no
         theme toggle, no pre-hydration theme boot. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1b2b" />
    <title>Rallypoint — Planner, Health & Events in One Account</title>
    <!-- Site-level SEO defaults. Per-route title/description/canonical/OG
         are swapped at runtime by src/ui/Seo.tsx; keep the copy here in
         sync with ROUTE_META['/'] in src/seo.ts. Crawlers and unfurlers
         that don't run JS see these defaults. -->
    <meta
      name="description"
      content="Rallypoint is an offline-ready, open-source suite that shares one account: a fast daily Planner, a Health training log, and an Events workspace for your crew — plus Cmd."
    />
    <link rel="canonical" href="https://rallypt.app/" />
    <link rel="icon" href="/icons/rallypt.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/rallypt-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rallypoint" />
    <meta property="og:title" content="Rallypoint — Planner, Health & Events in One Account" />
    <meta
      property="og:description"
      content="Plan your day, log your training, run your events — offline-ready, open source, one Rallypoint ID."
    />
    <meta property="og:url" content="https://rallypt.app/" />
    <meta property="og:image" content="https://rallypt.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rallypoint — Planner, Health & Events in One Account" />
    <meta
      name="twitter:description"
      content="Plan your day, log your training, run your events — offline-ready, open source, one Rallypoint ID."
    />
    <meta name="twitter:image" content="https://rallypt.app/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Rallypoint",
        "url": "https://rallypt.app",
        "logo": "https://rallypt.app/icons/rallypt-512.png",
        "sameAs": ["https://github.com/bbennetth/rallypoint-open"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
