# planner-api as a Cloudflare Worker (#313, Phase 5). `wrangler deploy --env qa`
# -> planner.rallypt.dev, `--env prod` -> planner.rallypt.app. Entry is
# src/worker.ts (`{ fetch, scheduled }`); the Node server.ts is retired.
#
# planner is a BFF: it proxies lists/events/RPID over HTTP. It has NO
# realtime Durable Object and NO R2 (no object store) — it does carry a
# RateLimitCounter Durable Object (RATE_LIMITS, #881) for the per-bucket
# rate limiter, unrelated to realtime. As the owner of its own push
# notifications it carries a [triggers] cron + two infra tables
# (push_subscriptions, scheduled_notifications) — the documented exception to
# the otherwise fetch-only / no-domain-table BFF posture.
#
# Account + auth come from CI/the deployer (CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID); D1 databases are auto-provisioned/name-linked by
# wrangler >=4.45 (bootstrap step creates rp-planner-{qa,prod} if absent).
# Real secrets via `wrangler secret bulk --env <env>` (cf-deploy.yml push-secrets step):
#   PLANNER_SESSION_KEY_V1
#   VAPID_PUBLIC_KEY      (served to planner-web via GET /api/v1/push/public-key)
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT         (contact URI, e.g. mailto:ops@rallypt.app)

name = "rallypoint-planner"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the planner-web SPA from the assets dir; run the Worker first only
# for the API, so /api/* hits the Worker while the SPA serves first-party
# from the same origin (the __Host- cookie config). The deploy build
# populates ./public from `npm run build -w @rallypoint/planner-web`; a
# committed placeholder keeps `wrangler dev` working pre-build.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# planner has no realtime Durable Object and no object store (no R2), so
# there is NO [[r2_buckets]] block. It DOES carry a [triggers] cron (below)
# for the notification drain, plus the RateLimitCounter Durable Object below
# (#881) for the per-bucket rate limiter.

# RateLimitCounter Durable Object (#881) — one SQLite-backed DO per token
# bucket, replacing the per-request D1 write in the rate limiter. DO
# migrations are append-only: this is a NEW tag, never edit it once shipped.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitCounter"]

[[durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitCounter"

# Local-dev / top-level config (used by `wrangler dev`). parseEnv fills
# dev-safe defaults for the secrets. RPID/LISTS/EVENTS are reached via the
# [[services]] RPC bindings below, not URL vars.
[vars]
NODE_ENV = "development"
PLANNER_UI_ORIGIN = "http://localhost:5177"

# Notification drain — every minute, so a timed notification fires within ~1
# minute of its due instant (1 min is Cloudflare's cron floor). Restated per
# env below (crons do not inherit into named envs).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rp-planner-local"
# Ignored by `wrangler dev --local` (local SQLite store); a real id is only
# needed for the per-env deploy blocks below.
database_id = "local-dev-unused"
migrations_dir = "../../packages/planner-db/migrations"

# Top-level service bindings — required for cross-process RPC under
# wrangler's local dev registry (PR 2 of feat/rpc-bindings).
[[services]]
binding = "RPID"
service = "rallypoint-id"
entrypoint = "IdRPC"

[[services]]
binding = "LISTS"
service = "rallypoint-lists"
entrypoint = "ListsRPC"

[[services]]
binding = "EVENTS"
service = "rallypoint-events"
entrypoint = "EventsRPC"

[[services]]
binding = "FITNESS"
service = "rallypoint-fitness"
entrypoint = "FitnessRPC"

# Workers AI binding for AI Assist (POST /api/v1/ui/assist/parse — free-text
# capture → task/shopping/event/note/diary categorization). Local `wrangler
# dev` proxies the call to the real Workers AI runtime when the developer is
# logged in; offline / absent → the route 503s.
[ai]
binding = "AI"

# AI trace-corpus ingest + feedback (ai-api). Fire-and-forget from the assist
# service; absent binding just means assist runs untraced.
[[services]]
binding = "AI_TRACES"
service = "rallypoint-ai"
entrypoint = "AiRPC"

# ---- QA: planner.rallypt.dev ----------------------------------------
# vars must be redeclared per env — wrangler does NOT inherit top-level
# [vars] into named envs, so omitting one here would let the zod default
# silently fall back to localhost (no "vars not inherited" warning only
# because every consumed var is restated).
# POSTHOG_KEY is the public phc_ project write key (same class of value
# the web bundles ship) — plaintext var, drives server-side $exception
# capture in the error handler. Omitted from dev [vars] → capture no-ops.
[env.qa]
# AI_GATEWAY_ID routes the AI Assist Workers AI call through the
# `rallypoint-ai` Cloudflare AI Gateway (logging / caching / cost visibility).
# The gateway must exist in the CF account before deploy. Omitted from the
# top-level dev [vars] so local `wrangler dev` calls Workers AI directly.
vars = { NODE_ENV = "production", TRUSTED_PROXY_HEADER = "cf-connecting-ip", PLANNER_UI_ORIGIN = "https://planner.rallypt.dev", AI_GATEWAY_ID = "rallypoint-ai", POSTHOG_KEY = "phc_pXfCBfcjuzNTkDuvouacPuiJjKxb5f9VM2FjUcBLA4bA", DEPLOY_ENV = "qa" }

[env.qa.triggers]
crons = ["* * * * *"]

[[env.qa.d1_databases]]
binding = "DB"
database_name = "rp-planner-qa"
# database_id injected by cf-deploy.yml at deploy time — do NOT add manually
# (name-linking fails `d1 migrations apply --remote`; bootstrap: `wrangler d1 create rp-planner-qa || true`).
migrations_dir = "../../packages/planner-db/migrations"

[[env.qa.durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitCounter"

# Service bindings: same-account cross-Worker calls to id/lists/events
# dispatch in-process via these bindings (the CF edge drops same-account
# loopback fetches to public hostnames). Path-matched against the bound
# Worker, so the existing ${*_API_URL}/api/v1/... URLs work unchanged. No
# top-level [[services]] block — local `wrangler dev` falls back to the
# public-fetch path so single-app dev keeps working.
[[env.qa.services]]
binding = "RPID"
service = "rallypoint-id-qa"
entrypoint = "IdRPC"

[[env.qa.services]]
binding = "LISTS"
service = "rallypoint-lists-qa"
entrypoint = "ListsRPC"

[[env.qa.services]]
binding = "EVENTS"
service = "rallypoint-events-qa"
entrypoint = "EventsRPC"

[[env.qa.services]]
binding = "FITNESS"
service = "rallypoint-fitness-qa"
entrypoint = "FitnessRPC"

[[env.qa.services]]
binding = "AI_TRACES"
service = "rallypoint-ai-qa"
entrypoint = "AiRPC"

[env.qa.ai]
binding = "AI"

[[env.qa.routes]]
pattern = "planner.rallypt.dev"
custom_domain = true

# ---- Prod: planner.rallypt.app --------------------------------------
[env.prod]
vars = { NODE_ENV = "production", TRUSTED_PROXY_HEADER = "cf-connecting-ip", PLANNER_UI_ORIGIN = "https://planner.rallypt.app", AI_GATEWAY_ID = "rallypoint-ai", POSTHOG_KEY = "phc_pXfCBfcjuzNTkDuvouacPuiJjKxb5f9VM2FjUcBLA4bA", DEPLOY_ENV = "prod" }

[env.prod.triggers]
crons = ["* * * * *"]

[[env.prod.d1_databases]]
binding = "DB"
database_name = "rp-planner-prod"
# database_id injected by cf-deploy.yml at deploy time — do NOT add manually
# (name-linking fails `d1 migrations apply --remote`; bootstrap: `wrangler d1 create rp-planner-prod || true`).
migrations_dir = "../../packages/planner-db/migrations"

[[env.prod.durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitCounter"

[[env.prod.services]]
binding = "RPID"
service = "rallypoint-id-prod"
entrypoint = "IdRPC"

[[env.prod.services]]
binding = "LISTS"
service = "rallypoint-lists-prod"
entrypoint = "ListsRPC"

[[env.prod.services]]
binding = "EVENTS"
service = "rallypoint-events-prod"
entrypoint = "EventsRPC"

[[env.prod.services]]
binding = "FITNESS"
service = "rallypoint-fitness-prod"
entrypoint = "FitnessRPC"

[[env.prod.services]]
binding = "AI_TRACES"
service = "rallypoint-ai-prod"
entrypoint = "AiRPC"

[env.prod.ai]
binding = "AI"

[[env.prod.routes]]
pattern = "planner.rallypt.app"
custom_domain = true
