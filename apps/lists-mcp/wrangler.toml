# lists-mcp as a Cloudflare Worker — remote MCP server speaking Streamable
# HTTP (JSON-RPC 2.0 over POST). Authenticates callers via a personal access
# token resolved through lists-api. NO D1, NO assets/SPA, NO Durable Object.
# Token resolution + list-data access dispatch through the LISTS service
# binding (RPC); the Worker has no secrets of its own (only NODE_ENV).

name = "rallypoint-lists-mcp"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Local-dev vars.
[vars]
NODE_ENV = "development"

# Top-level service binding — required for cross-process RPC under
# wrangler's local dev registry (PR 2 of feat/rpc-bindings).
[[services]]
binding = "LISTS"
service = "rallypoint-lists"
entrypoint = "ListsRPC"

# ---- QA: lists-mcp.rallypt.dev --------------------------------------
[env.qa]
vars = { NODE_ENV = "production" }

[[env.qa.services]]
binding = "LISTS"
service = "rallypoint-lists-qa"
entrypoint = "ListsRPC"

[[env.qa.routes]]
pattern = "lists-mcp.rallypt.dev"
custom_domain = true

# ---- Prod: lists-mcp.rallypt.app ------------------------------------
[env.prod]
vars = { NODE_ENV = "production" }

[[env.prod.services]]
binding = "LISTS"
service = "rallypoint-lists-prod"
entrypoint = "ListsRPC"

[[env.prod.routes]]
pattern = "lists-mcp.rallypt.app"
custom_domain = true
